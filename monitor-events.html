<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>톡톡 질문 기록</title>
    <style>
        :root {
            font-family: Inter, "Pretendard", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #eef4ff;
            background: #080d18;
            font-synthesis: none;
            --muted: #8d9ab2;
            --line: #202b40;
            --red: #ff8291;
            --amber: #ffc879;
            --purple: #a894ff;
        }
        * { box-sizing: border-box; }
        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(ellipse at 12% -10%, #243a6a55, transparent 38rem), #080d18;
        }
        .shell { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 56px; }
        a { color: inherit; text-decoration: none; }
        .back { display: inline-flex; align-items: center; gap: 8px; color: #aebbd0; font-size: .87rem; }
        .back:hover { color: white; }
        .eyebrow { margin-top: 40px; color: var(--amber); font-size: .73rem; font-weight: 800; letter-spacing: .15em; }
        h1 { margin: 10px 0 8px; font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: -.05em; }
        .intro { margin: 0; color: var(--muted); line-height: 1.65; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 27px 0 14px; }
        .count { color: #cbd5e5; font-size: .87rem; font-weight: 700; }
        .refresh { padding: 9px 13px; border: 1px solid var(--line); border-radius: 10px; color: #dce5f2; background: #111a2a; font: inherit; cursor: pointer; }
        .refresh:hover { border-color: #3b506b; }
        .events { display: grid; gap: 11px; }
        .event { padding: 17px 18px; border: 1px solid #202b40; border-radius: 14px; background: linear-gradient(145deg, #141e30, #101827 78%); }
        .event-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .time { color: #aab6cb; font-size: .78rem; }
        .badge { padding: 5px 9px; border-radius: 20px; color: var(--badge-color); background: color-mix(in srgb, var(--badge-color) 12%, transparent); font-size: .7rem; font-weight: 750; }
        .question { margin: 13px 0 0; color: #f3f6fc; font-size: .96rem; line-height: 1.7; overflow-wrap: anywhere; white-space: pre-wrap; }
        .reason { margin: 8px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.5; }
        .empty, .error { padding: 34px 20px; border: 1px dashed #34425a; border-radius: 14px; color: var(--muted); text-align: center; line-height: 1.7; }
        .error { color: var(--red); }
        .notice { margin-top: 18px; padding: 13px 15px; border: 1px solid #59472c; border-radius: 11px; color: #d9c9aa; background: #241d13; font-size: .78rem; line-height: 1.6; }
        @media (max-width: 560px) {
            .shell { padding-top: 28px; }
            .eyebrow { margin-top: 32px; }
            .event { padding: 15px; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <a class="back" href="/monitor">← 모니터링으로 돌아가기</a>
        <div class="eyebrow">RECENT WEBHOOK ISSUES</div>
        <h1 id="title">질문 기록</h1>
        <p class="intro">응답 실패 또는 무시된 톡톡 요청의 최근 기록입니다.</p>
        <div class="toolbar">
            <span class="count" id="count">기록을 불러오는 중...</span>
            <button class="refresh" id="refresh" type="button">새로고침</button>
        </div>
        <section class="events" id="events" aria-live="polite"></section>
        <aside class="notice">최근 100건 중 현재 Render 인스턴스 메모리에 남아 있는 기록만 표시합니다. 무료 서비스가 절전되거나 재시작되면 기록이 사라질 수 있습니다. 질문 내용은 개인정보를 포함할 수 있어 관리자 인증 후에만 열람할 수 있습니다.</aside>
    </main>
    <script>
        const labels = {
            fallback: { title: '미등록 안내', color: 'var(--amber)' },
            ignored: { title: '무시된 이벤트', color: 'var(--purple)' },
            error: { title: '처리 오류', color: 'var(--red)' }
        };

        function formatTimestamp(timestamp) {
            return new Intl.DateTimeFormat('ko-KR', {
                dateStyle: 'medium',
                timeStyle: 'medium'
            }).format(new Date(timestamp));
        }

        async function loadEvents() {
            const container = document.querySelector('#events');
            const count = document.querySelector('#count');
            container.replaceChildren();
            count.textContent = '기록을 불러오는 중...';

            const result = new URLSearchParams(window.location.search).get('result');
            const label = labels[result];
            if (!label) {
                count.textContent = '기록 종류를 확인할 수 없습니다.';
                container.innerHTML = '<div class="error">올바른 기록 종류를 지정해 주세요.</div>';
                return;
            }

            document.querySelector('#title').textContent = `${label.title} 질문 기록`;
            try {
                const response = await fetch(`/monitor/events/api?result=${encodeURIComponent(result)}`, {
                    cache: 'no-store'
                });
                if (!response.ok) {
                    throw new Error(response.status === 401
                        ? '인증되지 않았습니다. 페이지를 새로고침하고 관리자 계정으로 로그인해 주세요.'
                        : `기록을 불러오지 못했습니다 (HTTP ${response.status}).`);
                }

                const data = await response.json();
                count.textContent = `최근 기록 ${data.events.length}건`;
                if (data.events.length === 0) {
                    container.innerHTML = '<div class="empty">아직 이 유형의 기록이 없습니다.</div>';
                    return;
                }

                for (const event of data.events) {
                    const card = document.createElement('article');
                    card.className = 'event';
                    const head = document.createElement('div');
                    head.className = 'event-head';
                    const time = document.createElement('time');
                    time.className = 'time';
                    time.dateTime = event.timestamp;
                    time.textContent = formatTimestamp(event.timestamp);
                    const badge = document.createElement('span');
                    badge.className = 'badge';
                    badge.style.setProperty('--badge-color', label.color);
                    badge.textContent = label.title;
                    head.append(time, badge);

                    const question = document.createElement('p');
                    question.className = 'question';
                    question.textContent = event.question || '(질문 내용을 추출할 수 없는 요청)';
                    card.append(head, question);

                    if (event.reason) {
                        const reason = document.createElement('p');
                        reason.className = 'reason';
                        reason.textContent = event.reason;
                        card.append(reason);
                    }
                    container.append(card);
                }
            } catch (error) {
                count.textContent = '기록 조회 실패';
                const message = document.createElement('div');
                message.className = 'error';
                message.textContent = error.message || '잠시 후 다시 시도해 주세요.';
                container.append(message);
            }
        }

        document.querySelector('#refresh').addEventListener('click', loadEvents);
        loadEvents();
    </script>
</body>
</html>
